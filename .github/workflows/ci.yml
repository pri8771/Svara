name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          cands = []
          for runtime, devs in d.items():
              if "iOS" not in runtime:
                  continue
              for dev in devs:
                  if dev.get("isAvailable") and dev["name"].startswith("iPhone"):
                      cands.append((runtime, dev["name"], dev["udid"]))
          # Prefer the newest iOS runtime.
          cands.sort(key=lambda c: c[0], reverse=True)
          print(cands[0][2] if cands else "")
          ')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"; exit 1
          fi
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          PRETTY=cat
          command -v xcbeautify >/dev/null 2>&1 && PRETTY=xcbeautify
          xcodebuild test \
            -project Svara.xcodeproj \
            -scheme Svara \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | "$PRETTY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
