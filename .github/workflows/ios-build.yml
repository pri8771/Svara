name: iOS Compile Gate

# Minimal compile gate for My Mandir (Digital Temple) v0.
# Confirms the app builds with Xcode on a macOS runner. No code signing, no
# simulator boot, no secrets, no external services — just "does it compile".

on:
  push:
    branches:
      - claude/my-mandir-ios-v0-se5f3a
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep the gate cheap.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # The project uses pbxproj objectVersion 77 (Xcode 16+); pick the
          # newest installed Xcode rather than pinning an exact patch version.
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project DigitalTemple.xcodeproj \
            -scheme DigitalTemple \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
