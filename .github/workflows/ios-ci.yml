name: iOS CI

# Compile + runtime smoke gate for My Mandir (Digital Temple) v0.
# On a macOS runner with Xcode 16.4: builds for the iOS Simulator, then boots an
# iPhone 16 (iOS 18.5) simulator, installs and launches the app, verifies it
# survives launch (no crash), and uploads a launch screenshot as a build
# artifact. No signing, no TestFlight, no Firebase, no deployment, no third-party
# packages (only official actions/checkout and actions/upload-artifact).

on:
  push:
    branches:
      - claude/my-mandir-ios-v0-se5f3a
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.mymandir.digitaltemple
  SIM_NAME: iPhone 16
  SIM_OS: "18.5"

jobs:
  build:
    name: Build + runtime smoke (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Print Xcode version and available simulators
        run: |
          xcodebuild -version
          xcrun simctl list devicetypes
          xcrun simctl list runtimes

      - name: Build (compile gate)
        run: |
          set -o pipefail
          xcodebuild \
            -project DigitalTemple.xcodeproj \
            -scheme DigitalTemple \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${SIM_NAME},OS=${SIM_OS}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator
        run: |
          set -euo pipefail
          # Resolve the UDID of an available "iPhone 16" (exact name, not Pro/Plus).
          UDID=$(xcrun simctl list devices available \
            | grep -E "^[[:space:]]*${SIM_NAME} \(" \
            | head -n1 \
            | grep -oE "[0-9A-Fa-f-]{36}")
          if [ -z "${UDID}" ]; then
            echo "❌ No available '${SIM_NAME}' simulator found"; exit 1
          fi
          echo "SIM_UDID=${UDID}" >> "$GITHUB_ENV"
          echo "Booting ${SIM_NAME} (${UDID})"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b

      - name: Install and launch app (runtime smoke)
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug-iphonesimulator/DigitalTemple.app"
          test -d "${APP}" || { echo "❌ Built app not found at ${APP}"; exit 1; }
          xcrun simctl install "${SIM_UDID}" "${APP}"
          echo "Launching ${BUNDLE_ID}"
          xcrun simctl launch "${SIM_UDID}" "${BUNDLE_ID}"
          # Give SwiftUI/SwiftData a moment to render and seed.
          sleep 8

      - name: Capture launch screenshot
        if: always()
        run: |
          mkdir -p artifacts
          xcrun simctl io "${SIM_UDID}" screenshot artifacts/01-launch.png || true
          ls -la artifacts || true

      - name: Assert app survived launch (no crash)
        run: |
          set -euo pipefail
          if xcrun simctl spawn "${SIM_UDID}" launchctl list | grep -q "${BUNDLE_ID}"; then
            echo "✅ App still running after launch — no crash detected"
          else
            echo "❌ App is not running — it likely crashed on launch"
            # Surface any simulator crash reports to help diagnosis.
            CRASH_DIR="${HOME}/Library/Developer/CoreSimulator/Devices/${SIM_UDID}/data/Library/Logs/DiagnosticReports"
            if [ -d "${CRASH_DIR}" ]; then
              echo "--- crash reports ---"; ls -la "${CRASH_DIR}" || true
              mkdir -p artifacts && cp -R "${CRASH_DIR}" artifacts/crash-reports || true
            fi
            exit 1
          fi

      - name: Upload screenshot + diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-runtime-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  screen-walk:
    name: V0 screen-walk UI test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Run V0 screen-walk UI test
        run: |
          set -o pipefail
          xcodebuild test \
            -project DigitalTemple.xcodeproj \
            -scheme DigitalTempleUITests \
            -destination "platform=iOS Simulator,name=${SIM_NAME},OS=${SIM_OS}" \
            -resultBundlePath V0ScreenWalk.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p artifacts
          # The result bundle always contains the attachments.
          cp -R V0ScreenWalk.xcresult artifacts/ 2>/dev/null || true
          # Best-effort: also export the named PNG attachments for convenience.
          xcrun xcresulttool export attachments \
            --path V0ScreenWalk.xcresult \
            --output-path artifacts/screenshots 2>/dev/null || \
            echo "Attachment export not available; xcresult bundle still uploaded."
          echo "--- artifacts/ ---"; ls -la artifacts || true
          echo "--- artifacts/screenshots/ ---"; ls -la artifacts/screenshots || true

      - name: Upload screen-walk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-screen-walk-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
