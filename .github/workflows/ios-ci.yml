name: iOS CI

# Compile gate only for My Mandir (Digital Temple) v0.
# Performs a real iOS Simulator build with Xcode 16.4 on a macOS runner.
# No signing, no TestFlight, no Firebase, no deployment, no third-party tools.

on:
  push:
    branches:
      - claude/my-mandir-ios-v0-se5f3a
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Print Xcode version and available simulators
        run: |
          xcodebuild -version
          xcrun simctl list devicetypes
          xcrun simctl list runtimes

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project DigitalTemple.xcodeproj \
            -scheme DigitalTemple \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            CODE_SIGNING_ALLOWED=NO \
            build
